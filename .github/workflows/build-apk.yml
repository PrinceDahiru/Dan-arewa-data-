name: Build DAN AREWA DATA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Capacitor
        run: npm install

      - name: Bundle biometric plugin
        run: npx esbuild biometric-entry.js --bundle --format=iife --outfile=public/biometric.js

      - name: Create Android project
        run: npx cap add android

      - name: Add Android biometric permission
        run: |
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.USE_BIOMETRIC" />'
          if permission not in s:
              s = s.replace('<application', permission + '\\n    <application', 1)
          p.write_text(s)
          PYMANIFEST

      - name: Sync app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAN-AREWA-DATA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
